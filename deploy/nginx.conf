server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # OAuth callback URLs can contain a one-use code. Do not log request URLs.
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  location = /healthz { default_type application/json; return 200 '{"status":"ok","service":"lamadeja-web"}'; }
  # A location with add_header does not inherit the server's headers.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }
}
