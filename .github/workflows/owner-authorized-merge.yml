name: Owner authorized merge
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number explicitly authorized by the owner'
        required: true
      sha:
        description: 'Exact full 40-character HEAD SHA authorized for merge'
        required: true
      confirmation:
        description: 'Type MERGE followed by a space and the full SHA'
        required: true
permissions: {}
concurrency:
  group: owner-authorized-merge-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  owner-authorized-merge:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const { run } = require('./scripts/github/owner-merge-gate.cjs');
            await run({ github, context, core });
