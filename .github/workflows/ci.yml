name: Validate SaaS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: lamadeja_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://synthetic:synthetic@localhost:5432/lamadeja_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w @lamadeja/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @lamadeja/web
      - run: npm audit --audit-level=high

  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile, run, isolate, stop and fail readiness on DB loss
        env:
          STAGING_CONTAINER_CA_FILE: /etc/ssl/certs/ca-certificates.crt
        run: npm run test:containers
